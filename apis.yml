aid: servicetitan
url: https://raw.githubusercontent.com/api-evangelist/servicetitan/refs/heads/main/apis.yml
apis:
- aid: servicetitan:servicetitan-marketing-api
  name: ServiceTitan Marketing API
  tags:
  - Marketing
  - Campaigns
  - Attribution
  - Categories
  - Suppression
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/marketing/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Manage marketing campaigns, campaign categories, suppression lists, and attribution data that powers
    cost-per-lead and cost-per-booked-job reporting. Underpins Marketing Pro email and SMS campaigns.
- aid: servicetitan:servicetitan-marketing-reputation-api
  name: ServiceTitan Marketing Reputation API
  tags:
  - Marketing
  - Reputation
  - Reviews
  - Sentiment
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/marketingreputation/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Retrieve aggregated customer reviews and reputation metrics across Google, Facebook, Yelp, BBB, and
    other connected review providers. Read-only API surfacing review text, ratings, sentiment, and response
    state.
- aid: servicetitan:servicetitan-memberships-api
  name: ServiceTitan Memberships API
  tags:
  - Memberships
  - Recurring Services
  - Contracts
  - Subscription
  tags_raw:
  - Memberships
  - Recurring Services
  - Contracts
  - Subscriptions
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/memberships/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Manage membership types, customer memberships, membership invoice templates, recurring service types,
    and recurring service events. Drives the recurring revenue surface — maintenance agreements, club
    memberships, and annual tune-up plans.
- aid: servicetitan:servicetitan-service-agreements-api
  name: ServiceTitan Service Agreements API
  tags:
  - Service Agreements
  - Contracts
  - Commercial
  - Renewals
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/serviceagreements/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Manage commercial service agreements — contract terms, billed locations, line items, renewal cadence,
    and invoice generation rules. Used by commercial trades for multi-site recurring service contracts.
- aid: servicetitan:servicetitan-forms-api
  name: ServiceTitan Forms API
  tags:
  - Forms
  - Submissions
  - Compliance
  - Field Capture
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/forms/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Retrieve form definitions and field-completed form submissions including photos, signatures, checkbox
    values, and free-text responses. Used for safety checklists, equipment commissioning, compliance audits,
    and post-service surveys.
- aid: servicetitan:servicetitan-payroll-api
  name: ServiceTitan Payroll API
  tags:
  - Payroll
  - Timesheets
  - Adjustments
  - Compensation
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/payroll/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Manage payroll adjustments, gross-pay items, job splits, timesheet codes, activity codes, non-job
    timesheets, and payroll settings. Exports to ADP, Paychex, Gusto, Paylocity, and other downstream
    payroll providers.
- aid: servicetitan:servicetitan-timesheets-api
  name: ServiceTitan Timesheets API
  tags:
  - Timesheets
  - Time Tracking
  - Activity
  - Payroll
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/timesheets/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Read and write timesheet entries, activity codes, and shift segments tying technician time to jobs,
    non-job activities, paid time off, and travel. Feeds the Payroll API and FieldRoutes reconciliation.
- aid: servicetitan:servicetitan-reporting-api
  name: ServiceTitan Reporting API
  tags:
  - Reporting
  - Analytics
  - Custom Reports
  - Beta
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/reporting/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Run published custom reports with parameters and retrieve dynamic value sets used by report inputs.
    Lower rate limit than other surfaces — 1 of the same report per minute per tenant. Replaces fragile
    UI exports for BI pipelines.
- aid: servicetitan:servicetitan-sales-estimates-api
  name: ServiceTitan Sales & Estimates API
  tags:
  - Sales
  - Estimates
  - Quotes
  - Proposals
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/sales/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Create and retrieve estimates, estimate items, and proposal templates. Backs the Proposal Builder
    feature used to convert leads into approved scopes of work — including good / better / best presentations
    from technicians in the field.
- aid: servicetitan:servicetitan-customer-interactions-api
  name: ServiceTitan Customer Interactions API
  tags:
  - Customer Feedback
  - Technician Ratings
  - NPS
  - Surveys
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/customerinteractions/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Submit and retrieve post-service technician ratings and customer feedback. Powers the "How did we
    do?" SMS / email flow that aggregates into Marketing Reputation.
- aid: servicetitan:servicetitan-task-management-api
  name: ServiceTitan Task Management API
  tags:
  - Task
  - Workflows
  - Internal Tickets
  tags_raw:
  - Tasks
  - Workflow
  - Internal Tickets
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/taskmanagement/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Create, update, and resolve internal tasks, task types, sub-tasks, and task statuses. Used for office-to-field
    handoffs, escalations, and back-office workflows that aren't customer jobs.
- aid: servicetitan:servicetitan-telecom-api
  name: ServiceTitan Telecom API
  tags:
  - Telecom
  - Calls
  - Voice
  - Contact Center
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/telecom/v3/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Retrieve inbound and outbound call records, call recordings, call analytics, and call reasons. Powers
    Contact Center Pro reporting and Voice Agent transcript analysis.
- aid: servicetitan:servicetitan-scheduling-pro-api
  name: ServiceTitan Scheduling Pro API
  tags:
  - Scheduling Pro
  - Online Booking
  - Schedulers
  - Sessions
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/schedulingpro/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Power online booking widgets — list configured schedulers, retrieve scheduler availability, create
    and update booking sessions. Backed by the Schedule Engine acquisition; required for customer-facing
    self-service scheduling.
- aid: servicetitan:servicetitan-jbce-api
  name: ServiceTitan Job Booking & Capacity API
  tags:
  - Job Booking
  - Call Reasons
  - Capacity Estimation
  - Field Service
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/jbce/v2/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Retrieve call reasons, job booking call reason metadata, capacity-aware booking windows, and recommended
    slot suggestions. Bridges Telecom call intake with JPM job creation.
- aid: servicetitan:servicetitan-webhooks-api
  name: ServiceTitan Webhooks API
  tags:
  - Webhook
  - Event
  - Integration
  tags_raw:
  - Webhooks
  - Events
  - Integration
  humanURL: https://developer.servicetitan.io/api-details/
  baseURL: https://api.servicetitan.io/webhooks/v1/{tenant}/
  properties:
  - url: https://developer.servicetitan.io/api-details/
    type: Documentation
  description: >-
    Manage webhook subscriptions for customer, job, appointment, invoice, payment, and membership lifecycle
    events. V1 is closed to new subscriptions; V2 webhooks are in development. Polling-based change-tracking
    via `modifiedOnOrAfter` filters is the recommended interim pattern.
